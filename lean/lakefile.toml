name = "transition-systems"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true"]
defaultTargets = [
  "TransitionSystems",
  "water-pouring",
  "tower-of-hanoi",
  "check-two-phase-commit",
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "TransitionSystems"

[[lean_exe]]
name = "water-pouring"
root = "TransitionSystems.WaterPouring.RunWaterPouringB"

[[lean_exe]]
name = "tower-of-hanoi"
root = "TransitionSystems.TowerOfHanoi.RunTowerOfHanoiB"

[[lean_exe]]
name = "check-two-phase-commit"
root = "TransitionSystems.TwoPhaseCommit.CheckTwoPhaseCommitB"
