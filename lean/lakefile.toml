name = "transition-systems"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true"]
defaultTargets = ["transition-systems", "water-pouring", "tower-of-hanoi"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "transition-systems"

[[lean_exe]]
name = "water-pouring"
root = "\u00abtransition-systems\u00bb.RunWaterPouringB"

[[lean_exe]]
name = "tower-of-hanoi"
root = "\u00abtransition-systems\u00bb.RunTowerOfHanoiB"
